version = 0.1

##############################################################################
# PRODUCTION Environment
##############################################################################
[default.deploy.parameters]
stack_name = "yallabalagan-donate-site-prod"
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-prod"
s3_prefix = "yallabalagan-donate-site"
region = "eu-north-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=prod",
    "SenderEmail=yalla@yallabalagan.org",
    "AdminEmail=yalla@yallabalagan.org"
]
confirm_changeset = true
image_repositories = []

[default.build.parameters]
cached = true
parallel = true

##############################################################################
# DEVELOPMENT Environment
##############################################################################
[dev.deploy.parameters]
stack_name = "yallabalagan-donate-site-dev"
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-dev"
s3_prefix = "yallabalagan-donate-site"
region = "eu-north-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=dev",
    "SenderEmail=yalla-dev@yallabalagan.org",
    "AdminEmail=yalla-dev@yallabalagan.org"
]
confirm_changeset = false
image_repositories = []

[dev.build.parameters]
cached = true
parallel = true
