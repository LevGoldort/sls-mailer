AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: YallaBalagan Ticket Service - Serverless Infrastructure

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - dev
    Description: Environment name

  # Telegram Bot Token (храните в AWS Secrets Manager или SSM Parameter Store)
  TelegramBotToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Telegram Bot Token for admin bot (optional for dev)

  # All-Pay Login
  AllPayLogin:
    Type: String
    NoEcho: true
    Description: AllPay login username for API and refunds
    Default: ""

  # All-Pay Webhook Secret
  AllPayWebhookSecret:
    Type: String
    NoEcho: true
    Description: All-Pay webhook secret for payment verification

  # All-Pay API Key
  AllPayApiKey:
    Type: String
    NoEcho: true
    Description: AllPay API key for request signatures
    Default: ""

  # All-Pay Use API Flag
  AllPayUseApi:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Feature flag - use API instead of payment links

  # Payment Expiration Minutes
  PaymentExpireMinutes:
    Type: Number
    Default: 10
    MinValue: 5
    MaxValue: 60
    Description: Payment expiration timeout in minutes

  # Payment Mode
  PaymentMode:
    Type: String
    Default: mock
    AllowedValues: ["production", "mock"]
    Description: Payment provider mode - production (AllPay) or mock (testing)

  # SES Email
  SenderEmail:
    Type: String
    Description: Verified SES email for sending tickets
    Default: tickets@yallabalagan.org

  # Analytics IDs
  GA4Id:
    Type: String
    Default: G-RP1612BFV9
    Description: Google Analytics 4 Measurement ID

  FBPixelId:
    Type: String
    Default: "738718761834602"
    Description: Facebook Pixel ID

  AdminApiKeys:
    Type: String
    NoEcho: true
    Default: ""
    Description: Comma-separated list of admin API keys

  ActiveTrailApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Active Trail API key for SMS sending

  ActiveTrailSenderId:
    Type: String
    Default: "Yalla"
    Description: Active Trail SMS sender ID (pre-registered name)

  JwtSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Secret key for signing JWT tokens (min 32 chars recommended)

  FrontendDistributionId:
    Type: String
    Default: ""
    Description: CloudFront distribution ID for events frontend (events.yallabalagan.org)

  MetaAppId:
    Type: String
    Default: ""
    Description: Meta (Facebook) App ID for Instagram OAuth

  MetaAppSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Meta (Facebook) App Secret for Instagram OAuth

  FbAdAccountId:
    Type: String
    Default: ""
    Description: Facebook Ad Account ID (e.g. act_123456789)

  FbPageId:
    Type: String
    Default: ""
    Description: Facebook Page ID for ad creatives

  FbSystemUserToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Non-expiring Facebook System User token for Marketing API

  InstagramTokenKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: 64-char hex key (32 bytes) for AES-256-GCM encryption of Instagram tokens

  TikTokClientKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: TikTok app client_key (from TikTok Developer Portal)

  TikTokClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: TikTok app client_secret

  TikTokTokenKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: 64-char hex key (32 bytes) for AES-256-GCM encryption of TikTok tokens

  YoutubeClientId:
    Type: String
    NoEcho: true
    Default: ""
    Description: Google OAuth 2.0 client_id for YouTube integration

  YoutubeClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Google OAuth 2.0 client_secret for YouTube integration

  YoutubeTokenKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: 64-char hex key (32 bytes) for AES-256-GCM encryption of YouTube tokens

  ApiBaseUrl:
    Type: String
    Default: ""
    Description: API Gateway base URL used as OAuth redirect_uri (e.g. https://xxx.execute-api.region.amazonaws.com/prod)

  AdminBaseUrl:
    Type: String
    Default: ""
    Description: Admin panel base URL for post-OAuth redirect (e.g. https://admin.yallabalagan.org)

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PAYMENT_MODE: !Ref PaymentMode
        EMAIL_SENDER_LAMBDA: yallabalagan-email-sender
        EVENTS_TABLE: !Ref EventsTable
        LOCATIONS_TABLE: !Ref LocationsTable
        ORDERS_TABLE: !Ref OrdersTable
        COUPONS_TABLE: !Ref CouponsTable
        SEAT_RESERVATIONS_TABLE: !Ref SeatReservationsTable
        USERS_TABLE: !Ref UsersTable
        REFRESH_TOKENS_TABLE: !Ref RefreshTokensTable
        PERFORMERS_TABLE: !Ref PerformersTable
        PRODUCTS_TABLE: !Ref ProductsTable
        MERCHANDISE_ORDERS_TABLE: !Ref MerchandiseOrdersTable
        SHOWS_TABLE: !Ref ShowsTable
        EPISODES_TABLE: !Ref EpisodesTable
        INFLUENCERS_TABLE: !Ref InfluencersTable
        INSTAGRAM_CONNECTIONS_TABLE: !Ref InstagramConnectionsTable
        TIKTOK_CONNECTIONS_TABLE: !Ref TikTokConnectionsTable
        TIKTOK_CLIENT_KEY: !Ref TikTokClientKey
        TIKTOK_CLIENT_SECRET: !Ref TikTokClientSecret
        TIKTOK_TOKEN_KEY: !Ref TikTokTokenKey
        YOUTUBE_CONNECTIONS_TABLE: !Ref YouTubeConnectionsTable
        YOUTUBE_CLIENT_ID: !Ref YoutubeClientId
        YOUTUBE_CLIENT_SECRET: !Ref YoutubeClientSecret
        YOUTUBE_TOKEN_KEY: !Ref YoutubeTokenKey
        SOCIAL_POSTS_TABLE: !Ref SocialPostsTable
        SOCIAL_POSTER_LAMBDA: yallabalagan-social-poster
        CONFIG_TABLE: !Ref ConfigTable
        META_APP_ID: !Ref MetaAppId
        META_APP_SECRET: !Ref MetaAppSecret
        INSTAGRAM_TOKEN_KEY: !Ref InstagramTokenKey
        FB_AD_ACCOUNT_ID: !Ref FbAdAccountId
        FB_PAGE_ID: !Ref FbPageId
        FB_SYSTEM_USER_TOKEN: !Ref FbSystemUserToken
        API_BASE_URL: !Ref ApiBaseUrl
        ADMIN_BASE_URL: !Ref AdminBaseUrl
        MEDIA_BUCKET: !Ref MediaBucket
        FRONTEND_BUCKET: !Ref FrontendBucket

Resources:
  ##############################################################################
  # DynamoDB Tables
  ##############################################################################

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: date
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: event_type
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: DateIndex
          KeySchema:
            - AttributeName: PK
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SlugIndex
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: OwnerIndex
          KeySchema:
            - AttributeName: owner_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: EventTypeIndex
          KeySchema:
            - AttributeName: event_type
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  LocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-locations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SlugIndex
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: customer_email
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EventIndex
          KeySchema:
            - AttributeName: event_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: customer_email
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  CouponsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-coupons
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: valid_until
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: valid_until
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  SeatReservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-seat-reservations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: seat_id
          AttributeType: S
        - AttributeName: expires_at
          AttributeType: N
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
        - AttributeName: seat_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ExpirationIndex
          KeySchema:
            - AttributeName: event_id
              KeyType: HASH
            - AttributeName: expires_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: tenant_id
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: TenantIndex
          KeySchema:
            - AttributeName: tenant_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-refresh-tokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  PerformersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-performers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SlugIndex
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: TenantIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SlugIndex
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: PerformerIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  MerchandiseOrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-merchandise-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ProductIndex
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  ShowsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-shows
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SlugIndex
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  InfluencersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-influencers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  InstagramConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-instagram
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  TikTokConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-tiktok
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  YouTubeConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-youtube
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  SocialPostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-social-posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: scheduled_at
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusScheduledIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: scheduled_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [IsProd, yallabalagan-config, yallabalagan-config-dev]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  EpisodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: yallabalagan-episodes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
        - AttributeName: show_id
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SlugIndex
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: ShowIndex
          KeySchema:
            - AttributeName: show_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  ##############################################################################
  # S3 Buckets
  ##############################################################################

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If

        - IsProd

        - yallabalagan-ticket-media

        - !Sub yallabalagan-ticket-media-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedHeaders:
              - '*'
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If

        - IsProd

        - yallabalagan-tickets-frontend

        - !Sub yallabalagan-tickets-frontend-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  AdminBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If

        - IsProd

        - yallabalagan-ticket-admin

        - !Sub yallabalagan-ticket-admin-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
      Tags:
        - Key: Project
          Value: YallaBalagan-TicketService
        - Key: Environment
          Value: !Ref Environment

  AdminBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${AdminBucket.Arn}/*

  ##############################################################################
  # Lambda Functions
  ##############################################################################

  # Main API Handler
  TicketApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yallabalagan-ticket-api
      CodeUri: .
      Handler: lambdas/api-handler.lambda_handler
      Description: Main API handler for ticket service
      Environment:
        Variables:
          ALLPAY_LOGIN: !Ref AllPayLogin
          ALLPAY_WEBHOOK_SECRET: !Ref AllPayWebhookSecret
          ALLPAY_API_KEY: !Ref AllPayApiKey
          ALLPAY_USE_API: !Ref AllPayUseApi
          PAYMENT_EXPIRE_MINUTES: !Ref PaymentExpireMinutes
          ADMIN_API_KEYS: !Ref AdminApiKeys
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketApi
            Path: /api/{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LocationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CouponsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SeatReservationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PerformersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MerchandiseOrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InfluencersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InstagramConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TikTokConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref YouTubeConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SocialPostsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:yallabalagan-site-regenerator*"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:yallabalagan-email-sender*"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:yallabalagan-sms-sender*"
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:yallabalagan-social-poster*"

  UserApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yallabalagan-user-api
      CodeUri: .
      Handler: lambdas/user-api-handler.lambda_handler
      Description: Auth and user management endpoints
      Environment:
        Variables:
          ADMIN_API_KEYS: !Ref AdminApiKeys
          JWT_SECRET: !Ref JwtSecret
      # Routes wired manually in deploy.sh to avoid CloudFormation circular
      # dependency through TicketApi → ApiErrorAlarm → TicketApiFunctionRole.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RefreshTokensTable

  # Site Regenerator
  SiteRegeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yallabalagan-site-regenerator
      CodeUri: .
      Handler: lambdas/site-regenerator.lambda_handler
      Description: Generates static site from DynamoDB data
      Timeout: 60
      Environment:
        Variables:
          API_URL: !Sub https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
          S3_BUCKET: !Ref FrontendBucket
          GA4_ID: !Ref GA4Id
          FB_PIXEL_ID: !Ref FBPixelId
          CLOUDFRONT_DISTRIBUTION_ID: !Ref FrontendDistributionId
      Layers:
        - !Ref SiteTemplatesLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref LocationsTable
        - S3CrudPolicy:
            BucketName: !Ref FrontendBucket
        - Statement:
            - Effect: Allow
              Action: cloudfront:CreateInvalidation
              Resource: "*"
      Events:
        # Можно добавить EventBridge schedule для автоматической регенерации
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: false  # Включить при необходимости

  # Email Sender
  EmailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yallabalagan-email-sender
      CodeUri: .
      Handler: lambdas/email-sender.lambda_handler
      Description: Sends ticket confirmation emails
      MemorySize: 256
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref LocationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - SESCrudPolicy:
            IdentityName: !Ref SenderEmail

  # SMS Sender
  SmsSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yallabalagan-sms-sender
      CodeUri: .
      Handler: lambdas/sms-sender.lambda_handler
      Description: Sends SMS notifications via Active Trail
      MemorySize: 256
      Environment:
        Variables:
          ACTIVETRAIL_API_KEY: !Ref ActiveTrailApiKey
          ACTIVETRAIL_SENDER_ID: !Ref ActiveTrailSenderId
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable

  # Event Status Updater
  EventStatusUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yallabalagan-event-status-updater
      CodeUri: .
      Handler: lambdas/event-status-updater.lambda_handler
      Description: Updates event status based on date/time
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(10 minutes)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable

  # Pending Orders Cleaner
  PendingOrdersCleanerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yallabalagan-pending-orders-cleaner
      CodeUri: .
      Handler: lambdas/pending-orders-cleaner.lambda_handler
      Description: Cleans up expired pending orders
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable

  # Instagram Token Refresher
  InstagramTokenRefresherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yallabalagan-instagram-token-refresher
      CodeUri: .
      Handler: lambdas/instagram-token-refresher.lambda_handler
      Description: Auto-refreshes Instagram long-lived tokens before expiry
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(2 days)
            Description: Refresh Instagram tokens every 48h
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InstagramConnectionsTable

  # Social Poster
  SocialPosterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: yallabalagan-social-poster
      CodeUri: .
      Handler: lambdas/social-poster.lambda_handler
      Description: Posts to social platforms (Instagram Reels/Feed, TikTok, YouTube). Triggered by api-handler (immediate) or EventBridge cron (scheduled).
      MemorySize: 1024
      Timeout: 300
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"source": "scheduler"}'
            Description: Check for due scheduled social posts every 5 min
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SocialPostsTable
        - DynamoDBReadPolicy:
            TableName: !Ref InstagramConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TikTokConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref YouTubeConnectionsTable
        - S3ReadPolicy:
            BucketName: !Ref MediaBucket

  ##############################################################################
  # Lambda Layers
  ##############################################################################

  SiteTemplatesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !If

        - IsProd

        - yallabalagan-site-templates

        - !Sub yallabalagan-site-templates-${Environment}
      Description: Jinja2 templates for site generation
      ContentUri: frontend/
      CompatibleRuntimes:
        - python3.12

  ##############################################################################
  # API Gateway
  ##############################################################################

  TicketApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - '*'
      Tags:
        Project: YallaBalagan-TicketService
        Environment: !Ref Environment

  ##############################################################################
  # CloudWatch Alarms (опционально)
  ##############################################################################

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-ticket-api-errors
      AlarmDescription: Alert when API has high error rate
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiId
          Value: !Ref TicketApi

##############################################################################
# Outputs
##############################################################################

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: !If

        - IsProd

        - TicketApiUrl

        - !Sub ${Environment}-TicketApiUrl

  FrontendUrl:
    Description: Frontend S3 website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !If

        - IsProd

        - FrontendUrl

        - !Sub ${Environment}-FrontendUrl

  AdminUrl:
    Description: Admin S3 website URL
    Value: !GetAtt AdminBucket.WebsiteURL
    Export:
      Name: !If

        - IsProd

        - AdminUrl

        - !Sub ${Environment}-AdminUrl

  EventsTableName:
    Description: DynamoDB Events Table Name
    Value: !Ref EventsTable
    Export:
      Name: !If

        - IsProd

        - EventsTable

        - !Sub ${Environment}-EventsTable

  LocationsTableName:
    Description: DynamoDB Locations Table Name
    Value: !Ref LocationsTable
    Export:
      Name: !If

        - IsProd

        - LocationsTable

        - !Sub ${Environment}-LocationsTable

  OrdersTableName:
    Description: DynamoDB Orders Table Name
    Value: !Ref OrdersTable
    Export:
      Name: !If

        - IsProd

        - OrdersTable

        - !Sub ${Environment}-OrdersTable

  MediaBucketName:
    Description: Media S3 Bucket Name
    Value: !Ref MediaBucket
    Export:
      Name: !If

        - IsProd

        - MediaBucket

        - !Sub ${Environment}-MediaBucket

  SeatReservationsTableName:
    Description: DynamoDB Seat Reservations Table Name
    Value: !Ref SeatReservationsTable
    Export:
      Name: !If

        - IsProd

        - SeatReservationsTable

        - !Sub ${Environment}-SeatReservationsTable
