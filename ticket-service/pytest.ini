[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Coverage options
[coverage:run]
source = lambdas,utils,models
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */.aws-sam/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
