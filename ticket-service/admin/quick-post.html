<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быстрое добавление события</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            padding: 24px 16px;
            color: #333;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 { font-size: 26px; font-weight: 700; color: #667eea; }
        .header p  { color: #888; font-size: 14px; margin-top: 6px; }

        .card {
            background: white;
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }

        label .req { color: #e53e3e; margin-left: 2px; }

        input[type="text"],
        input[type="url"],
        input[type="datetime-local"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background: white;
            color: #333;
        }

        input:focus, textarea:focus, select:focus { border-color: #667eea; }

        textarea { resize: vertical; min-height: 80px; }

        .image-preview {
            margin-top: 10px;
            display: none;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .performer-list {
            border: 1.5px solid #ddd;
            border-radius: 8px;
            max-height: 160px;
            overflow-y: auto;
            padding: 8px;
        }

        .performer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 4px;
            border-radius: 6px;
            cursor: pointer;
        }

        .performer-item:hover { background: #f8f9ff; }

        .performer-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

        .performer-item img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: #e2e8f0;
        }

        .performer-item span { font-size: 13px; }

        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            margin-top: 8px;
        }

        .btn:hover:not(:disabled) { background: #5568d3; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner {
            display: inline-block;
            width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 18px;
            display: none;
        }

        .alert-error { background: #fff0f0; border: 1px solid #fca5a5; color: #dc2626; }
        .alert-success { background: #f0fff4; border: 1px solid #86efac; color: #16a34a; }

        .upload-btn-small {
            display: inline-block;
            padding: 8px 14px;
            background: #667eea;
            color: white;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
        }

        .upload-btn-small:hover { background: #5568d3; }

        input[type="file"] { display: none; }

        .upload-area {
            border: 2px dashed #c3c9f0;
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover { border-color: #667eea; background: #f8f9ff; }

        .upload-area.uploading { opacity: 0.6; pointer-events: none; }
        #gate {
            position: fixed; inset: 0;
            background: #f5f6fa;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        #gate.hidden { display: none; }
        .gate-box {
            background: white;
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .gate-box h2 { font-size: 22px; font-weight: 700; color: #667eea; margin-bottom: 8px; }
        .gate-box p  { color: #888; font-size: 14px; margin-bottom: 24px; }
        .gate-box input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #e0e0e0; border-radius: 8px;
            font-size: 16px; margin-bottom: 12px; outline: none;
        }
        .gate-box input:focus { border-color: #667eea; }
        .gate-box button {
            width: 100%; padding: 12px;
            background: #667eea; color: white;
            border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .gate-box button:hover { background: #5568d3; }
        .gate-error { color: #dc2626; font-size: 13px; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <div id="gate">
        <div class="gate-box">
            <h2>YallaBalagan</h2>
            <p>Введи код доступа</p>
            <input type="password" id="gate-password" placeholder="Код доступа" autofocus>
            <button onclick="checkGate()">Войти</button>
            <div class="gate-error" id="gate-error">Неверный код</div>
        </div>
    </div>
    <div class="container">
        <div class="header">
            <h1>YallaBalagan</h1>
            <p>Добавить внешнее событие</p>
        </div>

        <div class="card">
            <div id="alert-error" class="alert alert-error"></div>
            <div id="alert-success" class="alert alert-success"></div>

            <form id="quick-post-form">
                <div class="form-group">
                    <label>Секретный код <span class="req">*</span></label>
                    <input type="password" id="secret" placeholder="Введите код доступа" required>
                </div>

                <div class="form-group">
                    <label>Название <span class="req">*</span></label>
                    <input type="text" id="title" placeholder="Название события" required>
                </div>

                <div class="form-group">
                    <label>Дата и время <span class="req">*</span></label>
                    <input type="datetime-local" id="date" required>
                </div>

                <div class="form-group">
                    <label>Ссылка на событие <span class="req">*</span></label>
                    <input type="url" id="external-url" placeholder="https://..." required>
                    <div id="og-status" style="font-size:12px;color:#888;margin-top:4px;display:none"></div>
                </div>

                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="description" placeholder="Краткое описание (необязательно)"></textarea>
                </div>

                <div class="form-group">
                    <label>Обложка</label>
                    <div class="upload-area" id="upload-area" onclick="document.getElementById('image-file').click()">
                        Нажмите для загрузки фото
                    </div>
                    <input type="file" id="image-file" accept="image/*">
                    <div class="image-preview" id="image-preview">
                        <img id="image-preview-img" src="" alt="preview">
                    </div>
                    <input type="hidden" id="image-url">
                </div>

                <div class="form-group">
                    <label>Место проведения</label>
                    <div style="display:flex;gap:8px;align-items:center">
                        <select id="location" style="flex:1"></select>
                        <button type="button" onclick="openLocationPopup()" style="white-space:nowrap;padding:9px 12px;background:#f0f0f0;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;cursor:pointer;color:#555">+ Локация</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Участники / перформеры</label>
                    <input type="text" id="performer-search" placeholder="Поиск по имени..." style="margin-bottom:8px;padding:8px 10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;width:100%;box-sizing:border-box;outline:none">
                    <div class="performer-list" id="performer-list">
                        <div style="color:#aaa; font-size:13px; padding:4px">Загрузка...</div>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn">Опубликовать событие</button>
            </form>
        </div>
    </div>

    <!-- Location popup -->
    <div id="location-popup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:8888;align-items:center;justify-content:center">
        <div style="background:white;border-radius:16px;padding:32px;width:100%;max-width:400px;margin:16px;box-shadow:0 4px 24px rgba(0,0,0,0.15)">
            <h3 style="margin-bottom:20px;font-size:18px;color:#333">Новая локация</h3>
            <div style="margin-bottom:14px">
                <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:6px">Название <span style="color:#e53e3e">*</span></label>
                <input type="text" id="loc-name" placeholder="Название площадки" style="width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none">
            </div>
            <div style="margin-bottom:14px">
                <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:6px">Город <span style="color:#e53e3e">*</span></label>
                <input type="text" id="loc-city" placeholder="Тель-Авив" style="width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none">
            </div>
            <div style="margin-bottom:20px">
                <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:6px">Адрес <span style="color:#e53e3e">*</span></label>
                <input type="text" id="loc-address" placeholder="ул. Дизенгоф, 50" style="width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none">
            </div>
            <div style="margin-bottom:20px">
                <label style="font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:6px">Ссылка на Google Карты</label>
                <input type="url" id="loc-maps-url" placeholder="https://maps.app.goo.gl/..." style="width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none">
                <div id="loc-maps-status" style="font-size:12px;margin-top:4px;display:none"></div>
            </div>
            <div id="loc-error" style="color:#dc2626;font-size:13px;margin-bottom:12px;display:none"></div>
            <div style="display:flex;gap:10px">
                <button type="button" onclick="closeLocationPopup()" style="flex:1;padding:10px;background:#f0f0f0;border:none;border-radius:8px;font-size:14px;cursor:pointer;color:#555">Отмена</button>
                <button type="button" onclick="saveLocation()" id="loc-save-btn" style="flex:1;padding:10px;background:#667eea;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;color:white">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const isDev = window.location.hostname.includes('-dev') || window.location.hostname === 'localhost';
        const API_BASE = isDev
            ? 'https://d4xhvmdzbg.execute-api.eu-north-1.amazonaws.com/dev'
            : 'https://ovajavet67.execute-api.eu-north-1.amazonaws.com';

        const MEDIA_BUCKET = isDev ? 'yallabalagan-ticket-media-dev' : 'yallabalagan-ticket-media';

        // Pre-fill secret from URL ?secret=xxx
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('secret')) {
            document.getElementById('secret').value = urlParams.get('secret');
        }

        // ===== Load locations =====
        async function loadLocations(selectId) {
            try {
                const res = await fetch(`${API_BASE}/api/locations`);
                const data = await res.json();
                const sel = document.getElementById('location');
                sel.innerHTML = '<option value="">— не выбрано —</option>';
                (data.locations || []).forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc.location_id || loc.PK?.replace('LOCATION#', '');
                    opt.textContent = loc.name;
                    sel.appendChild(opt);
                });
                if (selectId) sel.value = selectId;
            } catch (e) {
                console.warn('Could not load locations', e);
            }
        }

        // ===== Load performers =====
        async function loadPerformers() {
            const container = document.getElementById('performer-list');
            try {
                const res = await fetch(`${API_BASE}/api/performers`);
                const data = await res.json();
                const performers = data.performers || [];
                if (performers.length === 0) {
                    container.innerHTML = '<div style="color:#aaa;font-size:13px;padding:4px">Нет перформеров</div>';
                    return;
                }
                container.innerHTML = '';
                performers.forEach(p => {
                    const id = p.performer_id;
                    const div = document.createElement('div');
                    div.className = 'performer-item';
                    div.innerHTML = `
                        <input type="checkbox" id="perf-${id}" value="${id}">
                        <img src="${p.photo_url || ''}" alt="" onerror="this.style.display='none'">
                        <span>${escapeHtml(p.name)}</span>
                    `;
                    div.addEventListener('click', (e) => {
                        if (e.target.tagName !== 'INPUT') {
                            const cb = div.querySelector('input[type=checkbox]');
                            cb.checked = !cb.checked;
                        }
                    });
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = '<div style="color:#aaa;font-size:13px;padding:4px">Не удалось загрузить</div>';
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ===== Image upload =====
        document.getElementById('image-file').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) await uploadImage(file);
        });

        // Drag-and-drop
        const _uploadArea = document.getElementById('upload-area');
        _uploadArea.addEventListener('dragover', e => { e.preventDefault(); _uploadArea.style.borderColor = '#667eea'; _uploadArea.style.background = '#f8f9ff'; });
        _uploadArea.addEventListener('dragleave', () => { _uploadArea.style.borderColor = ''; _uploadArea.style.background = ''; });
        _uploadArea.addEventListener('drop', async e => {
            e.preventDefault();
            _uploadArea.style.borderColor = ''; _uploadArea.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) await uploadImage(file);
        });

        // Paste anywhere on the page
        document.addEventListener('paste', async e => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    if (file) { await uploadImage(file); break; }
                }
            }
        });

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function uploadImage(file) {
            const area = document.getElementById('upload-area');
            area.classList.add('uploading');
            area.textContent = 'Загрузка...';

            try {
                const b64 = await fileToBase64(file);
                const secret = document.getElementById('secret').value.trim();
                const res = await fetch(`${API_BASE}/api/upload-image/quick`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        secret,
                        filename: file.name || 'upload.jpg',
                        contentType: file.type || 'image/jpeg',
                        data: b64,
                    }),
                });
                if (!res.ok) throw new Error('Upload failed');
                const data = await res.json();
                const url = data.url;
                document.getElementById('image-url').value = url;
                document.getElementById('image-preview-img').src = url;
                document.getElementById('image-preview').style.display = 'block';
                area.textContent = 'Фото загружено. Нажмите для замены.';
            } catch (e) {
                area.textContent = 'Ошибка загрузки. Попробуйте снова.';
                console.error(e);
            } finally {
                area.classList.remove('uploading');
            }
        }

        // ===== Form submit =====
        document.getElementById('quick-post-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submit-btn');
            const errorBox = document.getElementById('alert-error');
            const successBox = document.getElementById('alert-success');

            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            const secret = document.getElementById('secret').value.trim();
            const title = document.getElementById('title').value.trim();
            const dateRaw = document.getElementById('date').value;
            const externalUrl = document.getElementById('external-url').value.trim();
            const description = document.getElementById('description').value.trim();
            const imageUrl = document.getElementById('image-url').value;
            const locationId = document.getElementById('location').value;

            const performerIds = Array.from(
                document.querySelectorAll('#performer-list input[type=checkbox]:checked')
            ).map(cb => cb.value);

            if (!secret || !title || !dateRaw || !externalUrl) {
                errorBox.textContent = 'Заполните все обязательные поля.';
                errorBox.style.display = 'block';
                return;
            }

            // Convert datetime-local to ISO
            const date = new Date(dateRaw).toISOString();

            const payload = {
                secret,
                title,
                date,
                external_url: externalUrl,
                description,
                images: imageUrl ? [imageUrl] : [],
                location_id: locationId || null,
                performer_ids: performerIds,
            };

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Публикация...';

            try {
                const res = await fetch(`${API_BASE}/api/events/quick`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || `Ошибка ${res.status}`);
                }

                successBox.textContent = `Событие "${title}" опубликовано!`;
                successBox.style.display = 'block';
                document.getElementById('quick-post-form').reset();
                document.getElementById('image-preview').style.display = 'none';
                document.getElementById('image-url').value = '';
                document.getElementById('upload-area').textContent = 'Нажмите для загрузки фото';

            } catch (err) {
                errorBox.textContent = err.message || 'Произошла ошибка. Попробуйте снова.';
                errorBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Опубликовать событие';
            }
        });

        loadLocations();
        loadPerformers();

        // ===== Password gate =====
        const GATE_KEY = 'qp_access';
        const gate = document.getElementById('gate');

        if (localStorage.getItem(GATE_KEY) === '1') {
            gate.classList.add('hidden');
            prefillSecret();
        }

        document.getElementById('gate-password').addEventListener('keydown', e => {
            if (e.key === 'Enter') checkGate();
        });

        function checkGate() {
            const val = document.getElementById('gate-password').value;
            if (val === 'yallafriend') {
                localStorage.setItem(GATE_KEY, '1');
                gate.classList.add('hidden');
                prefillSecret();
            } else {
                document.getElementById('gate-error').style.display = 'block';
            }
        }

        function prefillSecret() {
            document.getElementById('secret').value = 'yallafriend';
        }

        // ===== Google Maps (в попапе локации) =====
        function extractMapsCoords(url) {
            let m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
            m = url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
            m = url.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
            return null;
        }

        document.addEventListener('blur', function(e) {
            if (e.target.id !== 'loc-maps-url') return;
            const url = e.target.value.trim();
            const status = document.getElementById('loc-maps-status');
            if (!url) { status.style.display = 'none'; return; }
            const coords = extractMapsCoords(url);
            if (coords) {
                status.textContent = `Координаты: ${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)} ✓`;
                status.style.color = '#16a34a';
            } else if (url.includes('goo.gl') || url.includes('maps.app')) {
                status.textContent = 'Короткая ссылка — координаты будут извлечены при сохранении';
                status.style.color = '#888';
            } else {
                status.textContent = 'Координаты не найдены в ссылке';
                status.style.color = '#dc2626';
            }
            status.style.display = 'block';
        }, true);

        // ===== OG auto-fetch =====
        document.getElementById('external-url').addEventListener('blur', async function() {
            const url = this.value.trim();
            if (!url) return;
            const status = document.getElementById('og-status');
            status.textContent = 'Загрузка данных из ссылки...';
            status.style.display = 'block';
            try {
                const res = await fetch(`${API_BASE}/api/url-preview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                });
                if (!res.ok) throw new Error();
                const data = await res.json();
                if (!document.getElementById('title').value && data.title) {
                    document.getElementById('title').value = data.title;
                }
                if (!document.getElementById('description').value && data.description) {
                    document.getElementById('description').value = data.description;
                }
                if (!document.getElementById('image-url').value && data.image) {
                    document.getElementById('image-url').value = data.image;
                    document.getElementById('image-preview-img').src = data.image;
                    document.getElementById('image-preview').style.display = 'block';
                    document.getElementById('upload-area').textContent = 'Фото загружено. Нажмите для замены.';
                }
                status.textContent = data.title ? 'Данные подтянуты ✓' : '';
                if (!data.title) status.style.display = 'none';
            } catch (_) {
                status.style.display = 'none';
            }
        });

        // ===== Location popup =====
        function openLocationPopup() {
            const popup = document.getElementById('location-popup');
            popup.style.display = 'flex';
            document.getElementById('loc-name').value = '';
            document.getElementById('loc-city').value = '';
            document.getElementById('loc-address').value = '';
            document.getElementById('loc-maps-url').value = '';
            document.getElementById('loc-maps-status').style.display = 'none';
            document.getElementById('loc-error').style.display = 'none';
            document.getElementById('loc-name').focus();
        }

        function closeLocationPopup() {
            document.getElementById('location-popup').style.display = 'none';
        }

        async function saveLocation() {
            const name = document.getElementById('loc-name').value.trim();
            const city = document.getElementById('loc-city').value.trim();
            const address = document.getElementById('loc-address').value.trim();
            const mapsUrl = document.getElementById('loc-maps-url').value.trim();
            const errDiv = document.getElementById('loc-error');
            const saveBtn = document.getElementById('loc-save-btn');

            if (!name || !city || !address) {
                errDiv.textContent = 'Заполните все поля';
                errDiv.style.display = 'block';
                return;
            }

            const secret = document.getElementById('secret').value.trim();
            saveBtn.disabled = true;
            saveBtn.textContent = 'Сохранение...';
            errDiv.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/api/locations/quick`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret, name, city, address, maps_url: mapsUrl || null }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
                closeLocationPopup();
                await loadLocations(data.location.location_id);
            } catch (err) {
                errDiv.textContent = err.message || 'Ошибка при сохранении';
                errDiv.style.display = 'block';
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Сохранить';
            }
        }

        // ===== Performer search =====
        document.getElementById('performer-search').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#performer-list .performer-item').forEach(item => {
                const name = item.querySelector('span')?.textContent.toLowerCase() || '';
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
