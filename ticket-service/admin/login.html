<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Yallabalagan Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: 700;
        }

        .logo p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }

        input:focus { border-color: #667eea; }

        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        .btn:hover:not(:disabled) { background: #5568d3; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error {
            background: #fff0f0;
            border: 1px solid #fca5a5;
            color: #dc2626;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>YallaBalagan</h1>
            <p>Панель управления</p>
        </div>

        <div id="error-box" class="error"></div>

        <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="admin@example.com" required autofocus>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" id="submit-btn" class="btn">Войти</button>
        </form>
    </div>

    <script>
        const isDev = window.location.hostname.includes('-dev') || window.location.hostname === 'localhost';
        window.API_BASE_URL = isDev
            ? 'https://wcyt1odrnc.execute-api.eu-north-1.amazonaws.com/dev'
            : 'https://ovajavet67.execute-api.eu-north-1.amazonaws.com';
    </script>
    <script src="auth.js"></script>
    <script>
        // Redirect if already authenticated
        if (Auth.isAuthenticated()) {
            window.location.href = 'index.html';
        }

        const form     = document.getElementById('login-form');
        const btn      = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error-box');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Вход...';

            try {
                await Auth.login(email, password);
                window.location.href = 'index.html';
            } catch (err) {
                showError(err.message || 'Ошибка входа. Проверьте email и пароль.');
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        });
    </script>
</body>
</html>
