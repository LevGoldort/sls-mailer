<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика - Ticket Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #667eea; margin-bottom: 20px; }
        .nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        .nav-btn:hover { background: #5568d3; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        .section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        .section h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .events-ranking {
            display: grid;
            gap: 15px;
        }
        .event-rank {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .event-rank-info {
            flex: 1;
        }
        .event-rank-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .event-rank-stats {
            font-size: 14px;
            color: #666;
        }
        .rank-badge {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            min-width: 40px;
            text-align: center;
        }
        .loading { text-align: center; padding: 60px; color: #666; }
        .empty { text-align: center; padding: 80px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 Аналитика и статистика</h1>
            <div class="nav">
                <a href="index.html" class="nav-btn">📊 Dashboard</a>
                <a href="events.html" class="nav-btn">🎪 События</a>
                <a href="locations.html" class="nav-btn">📍 Локации</a>
                <a href="orders.html" class="nav-btn">🛒 Заказы</a>
                <a href="analytics.html" class="nav-btn">📈 Аналитика</a>
                <a href="coupons.html" class="nav-btn">🎟️ Купоны</a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Общая выручка</h3>
                <div class="number" id="total-revenue">-</div>
            </div>
            <div class="stat-card">
                <h3>Средний чек</h3>
                <div class="number" id="avg-order">-</div>
            </div>
            <div class="stat-card">
                <h3>Всего билетов</h3>
                <div class="number" id="total-tickets">-</div>
            </div>
            <div class="stat-card">
                <h3>Конверсия</h3>
                <div class="number" id="conversion">-</div>
            </div>
        </div>

        <div class="section">
            <h2>Топ событий по продажам</h2>
            <div id="top-events" class="events-ranking">
                <div class="loading">Загрузка...</div>
            </div>
        </div>

        <div class="section">
            <h2>Топ событий по выручке</h2>
            <div id="top-revenue" class="events-ranking">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <script src="shared.js?v=1764370571"></script>
    <script>
        async function loadAnalytics() {
            try {
                const [eventsData, ordersData] = await Promise.all([
                    API.getEvents(),
                    API.getOrders()
                ]);

                const events = eventsData.events || [];
                const orders = ordersData.orders || [];

                // Calculate overall stats
                const orderStats = calculateOrdersStats(orders);
                const avgOrder = orderStats.totalOrders > 0 ? orderStats.totalRevenue / orderStats.totalOrders : 0;

                let totalTickets = 0;
                events.forEach(e => {
                    e.ticket_types?.forEach(tt => {
                        totalTickets += (tt.total || 0) - (tt.available || 0);
                    });
                });

                const conversion = events.length > 0 ? (orderStats.totalOrders / events.length * 100) : 0;

                document.getElementById('total-revenue').textContent = formatCurrency(orderStats.totalRevenue);
                document.getElementById('avg-order').textContent = formatCurrency(avgOrder);
                document.getElementById('total-tickets').textContent = totalTickets;
                document.getElementById('conversion').textContent = formatPercent(conversion);

                // Top events by tickets sold
                const eventStats = events.map(e => ({
                    ...e,
                    stats: calculateEventStats(e)
                })).sort((a, b) => b.stats.soldTickets - a.stats.soldTickets);

                displayTopEvents(eventStats.slice(0, 5), 'top-events', 'soldTickets');

                // Top events by revenue
                const eventsByRevenue = [...eventStats].sort((a, b) => b.stats.revenue - a.stats.revenue);
                displayTopEvents(eventsByRevenue.slice(0, 5), 'top-revenue', 'revenue');

            } catch (error) {
                handleError(error, 'Ошибка загрузки аналитики');
            }
        }

        function displayTopEvents(events, containerId, metric) {
            const container = document.getElementById(containerId);

            if (events.length === 0) {
                container.innerHTML = '<div class="empty">Нет данных</div>';
                return;
            }

            container.innerHTML = events.map((event, index) => {
                const value = metric === 'soldTickets' ?
                    `${event.stats.soldTickets} билетов` :
                    formatCurrency(event.stats.revenue);

                return `
                    <div class="event-rank">
                        <div class="rank-badge">#${index + 1}</div>
                        <div class="event-rank-info">
                            <div class="event-rank-title">${event.title}</div>
                            <div class="event-rank-stats">
                                ${value} • Заполненность: ${event.stats.capacity}%
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadAnalytics();
    </script>
</body>
</html>
