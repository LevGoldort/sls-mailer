<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Blast - Ticket Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #667eea; margin-bottom: 20px; }
        .nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        .nav-btn:hover { background: #5568d3; }
        .content {
            background: white;
            padding: 30px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 2px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, textarea:focus {
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .preview-box {
            background: #f8f9ff;
            border: 1px solid #d0d8ff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #444;
            min-height: 48px;
        }
        .preview-box strong { color: #667eea; }
        .btn-send {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-send:hover:not(:disabled) { background: #5568d3; }
        .btn-send:disabled { background: #aaa; cursor: not-allowed; }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .result-success {
            background: #e8f5e9;
            border: 1px solid #81c784;
            color: #2e7d32;
        }
        .result-error {
            background: #ffebee;
            border: 1px solid #ef9a9a;
            color: #c62828;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 SMS Blast</h1>
            <nav class="nav">
                <a href="index.html" class="nav-btn">Dashboard</a>
                <a href="events.html" class="nav-btn">Events</a>
                <a href="orders.html" class="nav-btn">Orders</a>
                <a href="coupons.html" class="nav-btn">Coupons</a>
            </nav>
        </div>

        <div class="content">
            <div class="form-group">
                <label for="event-select">Select Event</label>
                <select id="event-select" onchange="onEventChange()">
                    <option value="">-- Loading events... --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="custom-message">Custom Message (optional)</label>
                <textarea id="custom-message" placeholder="Prepended to the automatic ticket message. Leave blank to send default ticket info only." oninput="updatePreview()"></textarea>
            </div>

            <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                <input type="checkbox" id="include-ticket-info" checked onchange="updatePreview()" style="width:18px;height:18px;cursor:pointer;">
                <label for="include-ticket-info" style="margin-bottom:0;cursor:pointer;">Приложить билеты</label>
            </div>

            <div class="form-group">
                <label>Preview</label>
                <div class="preview-box" id="preview-box">
                    Select an event to see the SMS preview.
                </div>
            </div>

            <div class="preview-box" id="recipients-box" style="margin-bottom:20px;">
                <strong id="recipients-count">—</strong> buyers will receive this SMS
            </div>

            <button class="btn-send" id="btn-send" onclick="sendBlast()" disabled>
                Send SMS Blast
            </button>

            <div class="result-box" id="result-box"></div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        let events = [];
        let selectedEvent = null;
        let orderCount = 0;

        async function loadEvents() {
            try {
                const data = await API.getEvents();
                events = Array.isArray(data) ? data : (data.events || []);
                const select = document.getElementById('event-select');
                select.innerHTML = '<option value="">-- Select an event --</option>';
                events.forEach(ev => {
                    const opt = document.createElement('option');
                    opt.value = ev.event_id || ev.id;
                    opt.textContent = escapeHtml(ev.title || ev.name || opt.value);
                    select.appendChild(opt);
                });
                const params = new URLSearchParams(window.location.search);
                const preselect = params.get('id');
                if (preselect) {
                    const select = document.getElementById('event-select');
                    select.value = preselect;
                    if (select.value === preselect) await onEventChange();
                }
            } catch (err) {
                document.getElementById('event-select').innerHTML = '<option value="">Error loading events</option>';
                console.error('Failed to load events:', err);
            }
        }

        async function onEventChange() {
            const eventId = document.getElementById('event-select').value;
            selectedEvent = events.find(e => (e.event_id || e.id) === eventId) || null;
            orderCount = 0;
            document.getElementById('btn-send').disabled = true;

            if (!eventId) {
                document.getElementById('recipients-count').textContent = '—';
                updatePreview();
                return;
            }

            try {
                const orders = await API.getOrdersByEvent(eventId);
                const list = Array.isArray(orders) ? orders : (orders.orders || []);
                orderCount = list.filter(o => {
                    if (!o.payment || o.payment.status !== 'completed') return false;
                    if (!o.customer || !o.customer.phone) return false;
                    const qrs = o.qr_codes || [];
                    if (qrs.length > 0 && qrs.every(q => q.cancelled)) return false;
                    return true;
                }).length;
                document.getElementById('recipients-count').textContent = orderCount;
                document.getElementById('btn-send').disabled = orderCount === 0;
            } catch (err) {
                document.getElementById('recipients-count').textContent = 'Error';
            }
            updatePreview();
        }

        function updatePreview() {
            const custom = document.getElementById('custom-message').value.trim();
            const includeTicketInfo = document.getElementById('include-ticket-info').checked;
            const box = document.getElementById('preview-box');
            const eventTitle = selectedEvent ? (selectedEvent.title || selectedEvent.name || '') : '[Event Name]';
            const eventDate = selectedEvent ? (selectedEvent.date || '') : '';

            let parts = [];
            if (custom) parts.push(custom);
            if (includeTicketInfo) {
                if (eventDate) parts.push(`Дата: ${eventDate}`);
                parts.push('Место: [название и адрес площадки]');
                parts.push('Билеты онлайн: https://events.yallabalagan.org/ticket.html?order_id=<order_id>');
            }

            box.innerHTML = parts.length ? parts.map(p => escapeHtml(p)).join('<br>') : '<em>Сообщение пустое</em>';
        }

        async function sendBlast() {
            const eventId = document.getElementById('event-select').value;
            if (!eventId || orderCount === 0) return;

            if (!confirm(`Send SMS to ${orderCount} buyer(s) for this event?\n\nThis cannot be undone.`)) return;

            const customMessage = document.getElementById('custom-message').value.trim();
            const includeTicketInfo = document.getElementById('include-ticket-info').checked;
            const btn = document.getElementById('btn-send');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Sending...';

            const resultBox = document.getElementById('result-box');
            resultBox.style.display = 'none';

            try {
                const result = await API.sendSmsBlast(eventId, { custom_message: customMessage, include_ticket_info: includeTicketInfo });
                resultBox.className = 'result-box result-success';
                resultBox.textContent = `SMS blast triggered for ${result.triggered || orderCount} orders.`;
                resultBox.style.display = 'block';
                btn.innerHTML = 'Sent!';
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = 'Send SMS Blast';
                }, 3000);
            } catch (err) {
                resultBox.className = 'result-box result-error';
                resultBox.textContent = 'Error: ' + err.message;
                resultBox.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Send SMS Blast';
            }
        }

        loadEvents();
    </script>
</body>
</html>
