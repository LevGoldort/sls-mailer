version = 0.1

##############################################################################
# PRODUCTION Environment
##############################################################################
[default.deploy.parameters]
stack_name = "yallabalagan-ticket-service-prod"
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-prod"
s3_prefix = "yallabalagan-ticket-service"
region = "eu-north-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=prod",
    "SenderEmail=tickets@yallabalagan.org",
    "GA4Id=G-RP1612BFV9",
    "FBPixelId=738718761834602"
]
confirm_changeset = true
image_repositories = []

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

##############################################################################
# DEVELOPMENT Environment
##############################################################################
[dev.deploy.parameters]
stack_name = "yallabalagan-ticket-service-dev"
s3_bucket = "yallabalagan-sam-artifacts-dev"
s3_prefix = "yallabalagan-ticket-service"
region = "eu-north-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=dev",
    "SenderEmail=yalla@yallabalagan.org",
    "GA4Id=G-DEVDEVDEV",
    "FBPixelId=000000000"
]
confirm_changeset = false  # Быстрее для dev
image_repositories = []

[dev.build.parameters]
cached = true
parallel = true

[dev.validate.parameters]
lint = true

##############################################################################
# Local Testing
##############################################################################
[default.local.parameters]
warm_containers = "EAGER"

[default.local.start-api.parameters]
warm_containers = "EAGER"

[default.local.start-lambda.parameters]
warm_containers = "EAGER"
