version = 0.1

##############################################################################
# PRODUCTION Environment
##############################################################################
[default.deploy.parameters]
stack_name = "yallabalagan-ticket-service-prod"
s3_bucket = "aws-sam-cli-managed-default-samclisourcebucket-prod"
s3_prefix = "yallabalagan-ticket-service"
region = "eu-north-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=prod",
    "SenderEmail=tickets@yallabalagan.org",
    "GA4Id=G-RP1612BFV9",
    "FBPixelId=738718761834602",
    "FrontendDistributionId=E395U4QHM2AOIF"
    # AllPay credentials loaded from .env.prod via deploy script
]
confirm_changeset = true
image_repositories = []

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

##############################################################################
# DEVELOPMENT Environment
#
# Day-to-day deploys: ./deploy.sh dev
#
# First-time setup (new dev account):
#   sam build
#   sam package --s3-bucket yallabalagan-sam-artifacts-dev --s3-prefix yallabalagan-ticket-service \
#     --region eu-north-1 --profile dev --output-template-file /tmp/packaged-dev.yaml
#   aws cloudformation create-stack --stack-name yallabalagan-ticket-service-dev \
#     --template-body file:///tmp/packaged-dev.yaml \
#     --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
#     --parameters ParameterKey=Environment,ParameterValue=dev ... --profile dev --region eu-north-1
#   Then get API URL from stack outputs and set API_URL in .env.dev
#
# Note: sam deploy is NOT used because it triggers EarlyValidation::ResourceExistenceCheck
# which conflicts with S3 bucket creation. Use create-stack/update-stack directly.
##############################################################################
[dev.deploy.parameters]
stack_name = "yallabalagan-ticket-service-dev"
s3_bucket = "yallabalagan-sam-artifacts-dev"
s3_prefix = "yallabalagan-ticket-service"
region = "eu-north-1"
profile = "dev"
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=dev",
    "SenderEmail=yalla@yallabalagan.org",
    "GA4Id=G-DEVDEVDEV",
    "FBPixelId=000000000",
    "PaymentMode=mock",
    "AllPayUseApi=false",
    "AllPayWebhookSecret=dev-secret"
]
confirm_changeset = false
image_repositories = []

[dev.build.parameters]
cached = true
parallel = true

[dev.validate.parameters]
lint = true

##############################################################################
# Local Testing
##############################################################################
[default.local.parameters]
warm_containers = "EAGER"

[default.local.start-api.parameters]
warm_containers = "EAGER"

[default.local.start-lambda.parameters]
warm_containers = "EAGER"
