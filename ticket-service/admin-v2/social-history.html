<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>История постов — Yalla Balagan Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hist-grid { display: flex; flex-direction: column; gap: 10px; }
    .hist-card {
      border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
      background: #fff;
    }
    .hist-card-top { display: flex; align-items: flex-start; gap: 16px; }
    .hist-thumb {
      width: 56px; height: 56px; border-radius: 6px; object-fit: cover;
      background: var(--gray-light); flex-shrink: 0;
    }
    .hist-thumb-placeholder {
      width: 56px; height: 56px; border-radius: 6px; background: var(--gray-light);
      display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
    }
    .hist-info { flex: 1; min-width: 0; }
    .hist-caption { font-weight: 600; font-size: 14px; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-meta { font-size: 12px; color: var(--gray-mid); margin-top: 3px; }
    .hist-targets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .target-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px;
      border: 1px solid var(--border);
    }
    .target-chip.published { background: #dcfce7; color: #16a34a; border-color: #bbf7d0; }
    .target-chip.failed { background: #fee2e2; color: #dc2626; border-color: #fecaca; }
    .target-chip.pending { background: #fef9c3; color: #854d0e; border-color: #fef08a; }
    a.target-chip { text-decoration: none; }
    a.target-chip:hover { opacity: .85; }
    .status-badge {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; white-space: nowrap;
    }
    .status-badge.published    { background: #dcfce7; color: #16a34a; }
    .status-badge.partial_fail { background: #fef3c7; color: #92400e; }
    .status-badge.failed       { background: #fee2e2; color: #dc2626; }
    .status-badge.publishing   { background: #dbeafe; color: #1d4ed8; }
    .status-badge.scheduled    { background: #f3e8ff; color: #6d28d9; }
    .status-badge.draft        { background: var(--gray-light); color: var(--gray-mid); }
    .hist-date { font-size: 12px; color: var(--gray-mid); white-space: nowrap; flex-shrink: 0; min-width: 90px; text-align: right; }
    .hist-empty { text-align: center; padding: 48px 0; color: var(--gray-mid); font-size: 14px; }
  </style>
</head>
<body>
<button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar-container"></nav>
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">История постов</h1>
        <p class="page-subtitle">Кросс-пост публикации</p>
      </div>
      <div class="page-actions">
        <a href="social-settings.html" class="btn btn-secondary">Настройки</a>
        <a href="cross-post-studio.html" class="btn btn-primary">Новый пост</a>
      </div>
    </div>

    <div id="history-container"><div class="loading">Загрузка...</div></div>
  </main>
</div>
<script src="auth.js"></script>
<script src="shared.js"></script>
<script>
  const PLATFORM_LABELS = { instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube' };
  const PLATFORM_SHORT  = { instagram: 'IG', tiktok: 'TK', youtube: 'YT' };
  const STATUS_LABELS = {
    published: 'Опубликован', partial_fail: 'Частично', failed: 'Ошибка',
    publishing: 'Публикуется…', scheduled: 'Запланирован', draft: 'Черновик',
  };

  document.addEventListener('DOMContentLoaded', async () => {
    await initAdmin();
    loadHistory();
  });

  async function loadHistory() {
    const container = document.getElementById('history-container');
    try {
      const data = await apiCall('/api/social/posts');
      render(data.posts || []);
    } catch (e) {
      container.innerHTML = `<div class="error-msg">Ошибка: ${e.message}</div>`;
    }
  }

  function render(posts) {
    const container = document.getElementById('history-container');
    if (!posts.length) {
      container.innerHTML = '<div class="hist-empty">Постов пока нет. <a href="cross-post-studio.html">Создать первый →</a></div>';
      return;
    }
    const PRIORITY = { scheduled: 0, draft: 1, publishing: 2 };
    posts.sort((a, b) => {
      const pa = PRIORITY[a.status] ?? 3;
      const pb = PRIORITY[b.status] ?? 3;
      if (pa !== pb) return pa - pb;
      const da = new Date(a.published_at || a.scheduled_at || a.created_at);
      const db_ = new Date(b.published_at || b.scheduled_at || b.created_at);
      return pa < 3 ? da - db_ : db_ - da;
    });
    container.innerHTML = `<div class="hist-grid">${posts.map(renderCard).join('')}</div>`;
  }

  function renderCard(post) {
    const date = (post.published_at || post.scheduled_at || post.created_at)
      ? new Date(post.published_at || post.scheduled_at || post.created_at)
          .toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      : '—';

    const firstMedia = (post.media || [])[0];
    const thumb = firstMedia
      ? `<img class="hist-thumb" src="https://yallabalagan-ticket-media.s3.eu-north-1.amazonaws.com/${firstMedia.s3_key}" alt="" onerror="this.style.display='none'">`
      : `<div class="hist-thumb-placeholder">${firstMedia?.type === 'video' ? '🎬' : '🖼️'}</div>`;

    const text = post.title || post.description || post.caption;
    const caption = text
      ? (text.length > 80 ? text.slice(0, 80) + '…' : text)
      : '(без подписи)';

    const statusLabel = STATUS_LABELS[post.status] || post.status;
    const targets = (post.targets || []).map(t => {
      const short = PLATFORM_SHORT[t.platform] || t.platform;
      const acct = t.account_label ? ` @${t.account_label}` : '';
      const chipLabel = `${short}${acct}`;
      if (t.status === 'published' && t.platform === 'youtube' && t.platform_post_id) {
        return `<a href="https://www.youtube.com/watch?v=${t.platform_post_id}" target="_blank" class="target-chip published">${chipLabel} ↗</a>`;
      }
      return `<span class="target-chip ${t.status}">${chipLabel}</span>`;
    }).join('');

    const canDelete = ['draft', 'failed', 'scheduled', 'partial_fail'].includes(post.status);
    const canPublish = ['draft', 'failed', 'scheduled', 'partial_fail'].includes(post.status);

    return `
      <div class="hist-card">
        <div class="hist-card-top">
          ${thumb}
          <div class="hist-info">
            <div class="hist-caption">${escapeHtml(caption)}</div>
          </div>
          <div class="hist-date">${date}</div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <span class="status-badge ${post.status}">${statusLabel}</span>
            ${canPublish ? `<button class="btn btn-secondary btn-sm" onclick="publishNow('${post.SK}')">↺ Опубликовать</button>` : ''}
            ${canDelete ? `<button class="btn btn-secondary btn-sm" onclick="deletePost('${post.SK}')">✕</button>` : ''}
          </div>
        </div>
        ${targets ? `<div class="hist-targets">${targets}</div>` : ''}
      </div>
    `;
  }

  async function publishNow(postId) {
    if (!confirm('Опубликовать сейчас?')) return;
    try {
      await apiCall(`/api/social/posts/${postId}/publish`, 'POST');
      showToast('Отправлен на публикацию', 'success');
      loadHistory();
    } catch (e) {
      showToast(`Ошибка: ${e.message}`, 'error');
    }
  }

  async function deletePost(postId) {
    if (!confirm('Удалить пост?')) return;
    try {
      await apiCall(`/api/social/posts/${postId}`, 'DELETE');
      showToast('Удалён', 'success');
      loadHistory();
    } catch (e) {
      showToast(`Ошибка: ${e.message}`, 'error');
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg, type = 'info') {
    const el = document.getElementById('toast') || (() => {
      const t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); return t;
    })();
    el.textContent = msg;
    el.className = `toast toast-${type}`;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
</script>
</body>
</html>
