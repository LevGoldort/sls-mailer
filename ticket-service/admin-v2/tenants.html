<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тенанты — Yalla Balagan Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- Create modal -->
<div class="modal-overlay" id="create-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">Новый тенант</span>
      <button class="modal-close" onclick="closeCreate()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="c-name">Название *</label>
        <input class="form-input" type="text" id="c-name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="c-slug">Slug * <span style="font-size:11px;color:var(--gray-mid);">(латиница, цифры, дефис)</span></label>
        <input class="form-input" type="text" id="c-slug" placeholder="my-tenant" required>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCreate()">Отмена</button>
      <button class="btn btn-primary" onclick="createTenant()">Создать</button>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">Редактировать тенант</span>
      <button class="modal-close" onclick="closeEdit()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="e-name">Название *</label>
        <input class="form-input" type="text" id="e-name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="e-status">Статус</label>
        <select class="form-select" id="e-status">
          <option value="active">active</option>
          <option value="inactive">inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEdit()">Отмена</button>
      <button class="btn btn-primary" onclick="saveEdit()">Сохранить</button>
    </div>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar-container"></nav>
  <main class="main">
    <div class="page-header">
      <div><h1 class="page-title">Тенанты</h1></div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openCreate()">+ Создать</button>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th>Название</th>
            <th>Slug</th>
            <th>Статус</th>
            <th class="hide-mobile">Создан</th>
            <th>Действия</th>
          </tr></thead>
          <tbody id="tenants-tbody">
            <tr><td colspan="5"><div class="loading">Загрузка...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="auth.js"></script>
<script src="shared.js"></script>
<script>
  let allTenants = [];
  let editTenantId = null;

  async function load() {
    if (!Auth.isPlatformAdmin()) { window.location.href = 'index.html'; return; }
    try {
      const data = await API.getTenants();
      allTenants = data.tenants || [];
      render();
    } catch (err) { handleError(err, 'Ошибка загрузки'); }
  }

  function render() {
    const tbody = document.getElementById('tenants-tbody');
    if (!allTenants.length) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty"><span class="empty-text">Нет тенантов</span></div></td></tr>';
      return;
    }
    tbody.innerHTML = allTenants.map(t => {
      const statusClass = t.status === 'active' ? 'badge-active' : 'badge-inactive';
      return `<tr>
        <td style="font-weight:500;">${escapeHtml(t.name)}</td>
        <td><code style="font-size:12px;">${escapeHtml(t.slug)}</code></td>
        <td><span class="badge ${statusClass}">${escapeHtml(t.status)}</span></td>
        <td class="hide-mobile" style="font-size:13px;color:var(--gray-mid);">${t.created_at ? formatDateShort(t.created_at) : '—'}</td>
        <td><div class="table-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${escapeHtml(t.tenant_id)}')">Редактировать</button>
          <button class="btn btn-secondary btn-sm" onclick="doSwitch('${escapeHtml(t.tenant_id)}','${escapeHtml(t.name).replace(/'/g,"\\'")}')">Войти →</button>
        </div></td>
      </tr>`;
    }).join('');
  }

  function openCreate() {
    document.getElementById('c-name').value = '';
    document.getElementById('c-slug').value = '';
    document.getElementById('create-modal').classList.add('active');
  }
  function closeCreate() { document.getElementById('create-modal').classList.remove('active'); }

  function openEdit(tenantId) {
    const t = allTenants.find(x => x.tenant_id === tenantId);
    if (!t) return;
    editTenantId = tenantId;
    document.getElementById('e-name').value   = t.name;
    document.getElementById('e-status').value = t.status;
    document.getElementById('edit-modal').classList.add('active');
  }
  function closeEdit() {
    document.getElementById('edit-modal').classList.remove('active');
    editTenantId = null;
  }

  async function createTenant() {
    const name = document.getElementById('c-name').value.trim();
    const slug = document.getElementById('c-slug').value.trim();
    if (!name || !slug) { showToast('Заполните все поля', 'error'); return; }
    try {
      await API.createTenant({ name, slug });
      showToast('Тенант создан');
      closeCreate();
      await load();
    } catch (err) { handleError(err, 'Ошибка создания'); }
  }

  async function saveEdit() {
    const name   = document.getElementById('e-name').value.trim();
    const status = document.getElementById('e-status').value;
    if (!name) { showToast('Введите название', 'error'); return; }
    try {
      await API.updateTenant(editTenantId, { name, status });
      showToast('Тенант обновлён');
      closeEdit();
      await load();
    } catch (err) { handleError(err, 'Ошибка обновления'); }
  }

  async function doSwitch(tenantId, name) {
    if (!confirm(`Войти как тенант "${name}"?`)) return;
    try {
      await Auth.switchTenant(tenantId);
      window.location.href = 'index.html';
    } catch (err) { handleError(err, 'Ошибка переключения'); }
  }

  document.getElementById('create-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeCreate(); });
  document.getElementById('edit-modal').addEventListener('click',   e => { if (e.target === e.currentTarget) closeEdit(); });

  load();
</script>
</body>
</html>
