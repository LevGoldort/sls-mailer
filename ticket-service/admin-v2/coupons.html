<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Купоны — Yalla Balagan Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="coupon-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Новый купон</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="coupon-form">
        <div class="form-group">
          <label class="form-label" for="code">Код *</label>
          <input class="form-input" type="text" id="code" required placeholder="PROMO20" style="text-transform:uppercase;">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="discount_type">Тип скидки</label>
            <select class="form-select" id="discount_type">
              <option value="percent">Процент (%)</option>
              <option value="fixed">Фиксированная (₪)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="discount_value">Размер скидки</label>
            <input class="form-input" type="number" id="discount_value" min="0" placeholder="20">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="max_uses">Макс. использований</label>
            <input class="form-input" type="number" id="max_uses" min="0" placeholder="100">
          </div>
          <div class="form-group">
            <label class="form-label" for="expires_at">Срок действия</label>
            <input class="form-input" type="date" id="expires_at">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="event_id_filter">Событие (необязательно)</label>
          <select class="form-select" id="event_id_filter">
            <option value="">Все события</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="coupon-status">Статус</label>
          <select class="form-select" id="coupon-status">
            <option value="active">Активный</option>
            <option value="inactive">Неактивный</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveCoupon()">Сохранить</button>
    </div>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar-container"></nav>
  <main class="main">
    <div class="page-header">
      <div><h1 class="page-title">Купоны</h1></div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openCreateModal()">+ Создать купон</button>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="search-bar">
          <div class="search-input-wrap">
            <span class="search-input-icon">🔍</span>
            <input class="search-input" id="search" placeholder="Поиск по коду...">
          </div>
          <select class="form-select" id="status-filter" style="width:180px;">
            <option value="">Все статусы</option>
            <option value="active">Активные</option>
            <option value="inactive">Неактивные</option>
          </select>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Код</th><th>Скидка</th><th class="hide-mobile">Использовано</th><th class="hide-mobile">Срок</th><th>Статус</th><th>Действия</th></tr></thead>
            <tbody id="coupons-tbody"><tr><td colspan="6"><div class="loading">Загрузка...</div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="auth.js"></script>
<script src="shared.js"></script>
<script>
  let allCoupons = [], allEvents = [], editingCode = null;

  async function load() {
    if (!Auth.isAdmin()) { window.location.href = 'index.html'; return; }
    try {
      const [couponsData, eventsData] = await Promise.all([API.getCoupons(), API.getEvents()]);
      allCoupons = couponsData.coupons || [];
      allEvents  = eventsData.events   || [];

      const sel = document.getElementById('event_id_filter');
      allEvents.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.event_id;
        opt.textContent = e.title;
        sel.appendChild(opt);
      });
      render();
    } catch (err) { handleError(err, 'Ошибка загрузки'); }
  }

  function render() {
    const q      = document.getElementById('search').value.toLowerCase();
    const status = document.getElementById('status-filter').value;
    const filtered = allCoupons.filter(c => {
      const matchQ = !q || c.coupon_code.toLowerCase().includes(q);
      const matchS = !status || c.status === status;
      return matchQ && matchS;
    });

    const tbody = document.getElementById('coupons-tbody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><span class="empty-text">Нет купонов</span></div></td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(c => {
      const discountLabel = c.discount_type === 'percent'
        ? `${c.discount_value}%`
        : formatCurrency(c.discount_value);
      const usageLabel = c.max_uses ? `${c.used_count || 0}/${c.max_uses}` : (c.used_count || 0) + '/∞';
      const statusClass = c.status === 'active' ? 'badge-active' : 'badge-inactive';
      const expiry = c.expires_at ? formatDateShort(c.expires_at) : '—';
      return `<tr>
        <td style="font-weight:600;font-family:var(--mono);">${escapeHtml(c.coupon_code)}</td>
        <td>${discountLabel}</td>
        <td class="hide-mobile">${usageLabel}</td>
        <td class="hide-mobile">${expiry}</td>
        <td><span class="badge ${statusClass}">${c.status}</span></td>
        <td><div class="table-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEditModal('${c.coupon_code}')">Изменить</button>
          <button class="btn btn-danger btn-sm" onclick="deleteCoupon('${c.coupon_code}')">Удалить</button>
        </div></td>
      </tr>`;
    }).join('');
  }

  function openCreateModal() {
    editingCode = null;
    document.getElementById('modal-title').textContent = 'Новый купон';
    document.getElementById('coupon-form').reset();
    document.getElementById('code').disabled = false;
    document.getElementById('coupon-modal').classList.add('active');
  }

  function openEditModal(code) {
    const c = allCoupons.find(c => c.coupon_code === code);
    if (!c) return;
    editingCode = code;
    document.getElementById('modal-title').textContent = 'Редактировать купон';
    document.getElementById('code').value          = c.coupon_code;
    document.getElementById('code').disabled       = true;
    document.getElementById('discount_type').value  = c.discount_type || 'percent';
    document.getElementById('discount_value').value = c.discount_value || '';
    document.getElementById('max_uses').value       = c.max_uses || '';
    document.getElementById('expires_at').value     = c.expires_at ? c.expires_at.slice(0,10) : '';
    document.getElementById('event_id_filter').value = c.event_id || '';
    document.getElementById('coupon-status').value  = c.status || 'active';
    document.getElementById('coupon-modal').classList.add('active');
  }

  function closeModal() { document.getElementById('coupon-modal').classList.remove('active'); }

  async function saveCoupon() {
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true;
    const payload = {
      coupon_code:    document.getElementById('code').value.trim().toUpperCase(),
      discount_type:  document.getElementById('discount_type').value,
      discount_value: parseFloat(document.getElementById('discount_value').value) || 0,
      max_uses:       parseInt(document.getElementById('max_uses').value) || null,
      expires_at:     document.getElementById('expires_at').value || null,
      event_id:       document.getElementById('event_id_filter').value || null,
      status:         document.getElementById('coupon-status').value,
    };
    try {
      if (editingCode) {
        await API.updateCoupon(editingCode, payload);
        showToast('Купон обновлён');
      } else {
        await API.createCoupon(payload);
        showToast('Купон создан');
      }
      closeModal();
      await load();
    } catch (err) {
      handleError(err, 'Ошибка сохранения');
    } finally { btn.disabled = false; }
  }

  async function deleteCoupon(code) {
    if (!confirm(`Удалить купон "${code}"?`)) return;
    try { await API.deleteCoupon(code); showToast('Купон удалён'); await load(); }
    catch (err) { handleError(err, 'Ошибка удаления'); }
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('status-filter').addEventListener('change', render);
  document.getElementById('coupon-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  load();
</script>
</body>
</html>
