<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Купоны — Yalla Balagan Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="coupon-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Новый купон</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="coupon-form">
        <div class="form-group">
          <label class="form-label" for="code">Код *</label>
          <input class="form-input" type="text" id="code" required placeholder="PROMO20" style="text-transform:uppercase;">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="discount_type">Тип скидки</label>
            <select class="form-select" id="discount_type">
              <option value="percent">Процент (%)</option>
              <option value="fixed">Фиксированная (₪)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="discount_value">Размер скидки</label>
            <input class="form-input" type="number" id="discount_value" min="0" placeholder="20">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="max_uses">Макс. использований</label>
            <input class="form-input" type="number" id="max_uses" min="0" placeholder="100">
          </div>
          <div class="form-group">
            <label class="form-label" for="expires_at">Срок действия</label>
            <input class="form-input" type="date" id="expires_at">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="event_id_filter">Событие (необязательно)</label>
          <select class="form-select" id="event_id_filter">
            <option value="">Все события</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="coupon-status">Статус</label>
          <select class="form-select" id="coupon-status">
            <option value="active">Активный</option>
            <option value="inactive">Неактивный</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveCoupon()">Сохранить</button>
    </div>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar-container"></nav>
  <main class="main">
    <div class="page-header">
      <div><h1 class="page-title">Купоны</h1></div>
      <div class="page-actions">
        <button class="btn btn-primary" id="create-btn" onclick="openCreateModal()">+ Создать купон</button>
      </div>
    </div>

    <div class="card">
      <div class="card-body" style="padding-bottom:0;">
        <div class="tabs">
          <button class="tab active" id="tab-regular" onclick="switchTab('regular')">
            Купоны <span class="tab-count" id="count-regular">0</span>
          </button>
          <button class="tab" id="tab-influencer" onclick="switchTab('influencer')">
            Инфлюенсеры <span class="tab-count" id="count-influencer">0</span>
          </button>
        </div>
      </div>

      <!-- Tab: regular coupons -->
      <div id="regular-tab" class="tab-content active">
        <div class="card-body">
          <div class="search-bar">
            <div class="search-input-wrap">
              <span class="search-input-icon">🔍</span>
              <input class="search-input" id="search" placeholder="Поиск по коду...">
            </div>
            <select class="form-select" id="status-filter" style="width:180px;">
              <option value="">Все статусы</option>
              <option value="active">Активные</option>
              <option value="inactive">Неактивные</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr>
                <th>Код</th>
                <th>Скидка</th>
                <th class="hide-mobile">Использовано</th>
                <th class="hide-mobile">Срок</th>
                <th>Статус</th>
                <th>Действия</th>
              </tr></thead>
              <tbody id="coupons-tbody">
                <tr><td colspan="6"><div class="loading">Загрузка...</div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Tab: influencer coupons -->
      <div id="influencer-tab" class="tab-content">
        <div class="card-body">
          <div class="search-bar">
            <div class="search-input-wrap">
              <span class="search-input-icon">🔍</span>
              <input class="search-input" id="inf-search" placeholder="Поиск по коду или имени...">
            </div>
            <select class="form-select" id="inf-status-filter" style="width:180px;">
              <option value="">Все статусы</option>
              <option value="active">Активные</option>
              <option value="inactive">Неактивные</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr>
                <th>Код</th>
                <th>Инфлюенсер</th>
                <th class="hide-mobile">Использовано</th>
                <th class="hide-mobile">Продажи</th>
                <th class="hide-mobile">Комиссия</th>
                <th>Статус</th>
                <th></th>
              </tr></thead>
              <tbody id="influencer-coupons-tbody">
                <tr><td colspan="7"><div class="loading">Загрузка...</div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="auth.js"></script>
<script src="shared.js"></script>
<script>
  let allCoupons = [], allEvents = [], allInfluencers = [], editingCode = null;
  let influencerById = {};

  async function load() {
    if (!Auth.isAdmin()) { window.location.href = 'index.html'; return; }
    try {
      const [couponsData, eventsData, influencersData] = await Promise.all([
        API.getCoupons(),
        API.getEvents(),
        API.getInfluencers(),
      ]);
      allCoupons     = couponsData.coupons     || [];
      allEvents      = eventsData.events       || [];
      allInfluencers = influencersData.influencers || [];

      influencerById = {};
      allInfluencers.forEach(inf => { influencerById[inf.influencer_id] = inf; });

      const sel = document.getElementById('event_id_filter');
      allEvents.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.event_id;
        opt.textContent = e.title;
        sel.appendChild(opt);
      });

      const regular    = allCoupons.filter(c => !c.influencer_id);
      const influenced = allCoupons.filter(c =>  !!c.influencer_id);
      document.getElementById('count-regular').textContent    = regular.length;
      document.getElementById('count-influencer').textContent = influenced.length;

      render();
      renderInfluencerCoupons();
    } catch (err) { handleError(err, 'Ошибка загрузки'); }
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.getElementById(tab + '-tab').classList.add('active');
    document.getElementById('create-btn').style.display = tab === 'regular' ? '' : 'none';
  }

  // ── Regular coupons ──────────────────────────────────────────────────────

  function render() {
    const q      = document.getElementById('search').value.toLowerCase();
    const status = document.getElementById('status-filter').value;
    const regular = allCoupons.filter(c => !c.influencer_id);
    const filtered = regular.filter(c => {
      const matchQ = !q || c.coupon_code.toLowerCase().includes(q);
      const matchS = !status || c.status === status;
      return matchQ && matchS;
    });

    const tbody = document.getElementById('coupons-tbody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><span class="empty-text">Нет купонов</span></div></td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(c => {
      const discountLabel = (c.discount_type === 'percent' || c.discount_type === 'percentage')
        ? `${c.discount_value}%`
        : formatCurrency(c.discount_value);
      const usageLabel = c.max_uses ? `${c.used_count || 0}/${c.max_uses}` : (c.used_count || 0) + '/∞';
      const statusClass = c.status === 'active' ? 'badge-active' : 'badge-inactive';
      const expiry = c.expires_at ? formatDateShort(c.expires_at) : '—';
      return `<tr>
        <td style="font-weight:600;font-family:var(--mono);">${escapeHtml(c.coupon_code)}</td>
        <td>${discountLabel}</td>
        <td class="hide-mobile">${usageLabel}</td>
        <td class="hide-mobile">${expiry}</td>
        <td><span class="badge ${statusClass}">${c.status}</span></td>
        <td><div class="table-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEditModal('${c.coupon_code}')">Изменить</button>
          <button class="btn btn-danger btn-sm" onclick="deleteCoupon('${c.coupon_code}')">Удалить</button>
        </div></td>
      </tr>`;
    }).join('');
  }

  // ── Influencer coupons ───────────────────────────────────────────────────

  function renderInfluencerCoupons() {
    const q      = document.getElementById('inf-search').value.toLowerCase();
    const status = document.getElementById('inf-status-filter').value;
    const influenced = allCoupons.filter(c => !!c.influencer_id);
    const filtered = influenced.filter(c => {
      const inf = influencerById[c.influencer_id] || {};
      const matchQ = !q
        || c.coupon_code.toLowerCase().includes(q)
        || (inf.name || '').toLowerCase().includes(q);
      const matchS = !status || c.status === status;
      return matchQ && matchS;
    });

    const tbody = document.getElementById('influencer-coupons-tbody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty"><span class="empty-text">Нет купонов инфлюенсеров</span></div></td></tr>';
      return;
    }

    const FRONTEND_URL = 'https://yallabalagan.org';
    tbody.innerHTML = filtered.map(c => {
      const inf = influencerById[c.influencer_id] || {};
      const name = inf.name ? escapeHtml(inf.name) : `<span style="opacity:.4;">${c.influencer_id.slice(0,8)}…</span>`;
      const usageLabel = (c.used_count || 0) + '/∞';
      const sales      = inf.total_sales      != null ? Number(inf.total_sales).toFixed(0)      + '₪' : '—';
      const commission = inf.total_commission != null ? Number(inf.total_commission).toFixed(2) + '₪' : '—';
      const statusClass = c.status === 'active' ? 'badge-active' : 'badge-inactive';
      const dashUrl = inf.influencer_id
        ? `${FRONTEND_URL}/loyalty-dashboard.html?id=${encodeURIComponent(inf.influencer_id)}`
        : '#';
      return `<tr>
        <td style="font-weight:600;font-family:var(--mono);">${escapeHtml(c.coupon_code)}</td>
        <td>${name}</td>
        <td class="hide-mobile">${usageLabel}</td>
        <td class="hide-mobile" style="font-family:var(--mono);">${sales}</td>
        <td class="hide-mobile" style="font-family:var(--mono);font-weight:700;color:var(--accent);">${commission}</td>
        <td><span class="badge ${statusClass}">${c.status}</span></td>
        <td><a href="${escapeHtml(dashUrl)}" target="_blank" class="btn btn-ghost btn-sm">→</a></td>
      </tr>`;
    }).join('');
  }

  // ── Modal ────────────────────────────────────────────────────────────────

  function openCreateModal() {
    editingCode = null;
    document.getElementById('modal-title').textContent = 'Новый купон';
    document.getElementById('coupon-form').reset();
    document.getElementById('code').disabled = false;
    document.getElementById('coupon-modal').classList.add('active');
  }

  function openEditModal(code) {
    const c = allCoupons.find(c => c.coupon_code === code);
    if (!c) return;
    editingCode = code;
    document.getElementById('modal-title').textContent = 'Редактировать купон';
    document.getElementById('code').value          = c.coupon_code;
    document.getElementById('code').disabled       = true;
    const _dt = c.discount_type === 'percentage' ? 'percent' : (c.discount_type === 'fixed_amount' ? 'fixed' : (c.discount_type || 'percent'));
    document.getElementById('discount_type').value  = _dt;
    document.getElementById('discount_value').value = c.discount_value || '';
    document.getElementById('max_uses').value       = c.max_uses || '';
    document.getElementById('expires_at').value     = c.expires_at ? c.expires_at.slice(0,10) : '';
    document.getElementById('event_id_filter').value = c.event_id || '';
    document.getElementById('coupon-status').value  = c.status || 'active';
    document.getElementById('coupon-modal').classList.add('active');
  }

  function closeModal() { document.getElementById('coupon-modal').classList.remove('active'); }

  async function saveCoupon() {
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true;
    const payload = {
      coupon_code:    document.getElementById('code').value.trim().toUpperCase(),
      discount_type:  document.getElementById('discount_type').value,
      discount_value: parseFloat(document.getElementById('discount_value').value) || 0,
      max_uses:       parseInt(document.getElementById('max_uses').value) || null,
      expires_at:     document.getElementById('expires_at').value || null,
      event_id:       document.getElementById('event_id_filter').value || null,
      status:         document.getElementById('coupon-status').value,
    };
    try {
      if (editingCode) {
        await API.updateCoupon(editingCode, payload);
        showToast('Купон обновлён');
      } else {
        await API.createCoupon(payload);
        showToast('Купон создан');
      }
      closeModal();
      await load();
    } catch (err) {
      handleError(err, 'Ошибка сохранения');
    } finally { btn.disabled = false; }
  }

  async function deleteCoupon(code) {
    if (!confirm(`Удалить купон "${code}"?`)) return;
    try { await API.deleteCoupon(code); showToast('Купон удалён'); await load(); }
    catch (err) { handleError(err, 'Ошибка удаления'); }
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('status-filter').addEventListener('change', render);
  document.getElementById('inf-search').addEventListener('input', renderInfluencerCoupons);
  document.getElementById('inf-status-filter').addEventListener('change', renderInfluencerCoupons);
  document.getElementById('coupon-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  load();
</script>
</body>
</html>
