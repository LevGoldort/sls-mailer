<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Войти — Yalla Balagan Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <span class="login-logo">Yalla, Balagan</span>
    <p class="login-tagline">Панель администратора</p>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" name="email"
               placeholder="admin@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Пароль</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-lg" type="submit" id="submit-btn">
        Войти
      </button>
    </form>
  </div>
</div>

<script>
  // Detect env early (before auth.js loads, for consistency)
  const isDev = window.location.hostname.includes('-dev') || window.location.hostname === 'localhost';
  window.API_BASE_URL = isDev
    ? 'https://d4xhvmdzbg.execute-api.eu-north-1.amazonaws.com/dev'
    : 'https://ovajavet67.execute-api.eu-north-1.amazonaws.com';
</script>
<script src="auth.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isAuthenticated()) window.location.href = 'index.html';

  const form  = document.getElementById('login-form');
  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('visible');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner spinner-white"></span> Вход...';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      await Auth.login(email, password);
      window.location.href = 'index.html';
    } catch (err) {
      errEl.textContent = err.message || 'Ошибка входа';
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  });
</script>
</body>
</html>
