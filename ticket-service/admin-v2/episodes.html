<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эпизоды — Yalla Balagan Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar-container"></nav>
  <main class="main">
    <div class="page-header">
      <div>
        <a href="shows.html" style="font-size:13px;color:var(--gray-mid);">← Назад к шоу</a>
        <h1 class="page-title" style="margin-top:6px;">Эпизоды</h1>
      </div>
      <div class="page-actions">
        <a href="episodes-edit.html" class="btn btn-primary" id="add-btn">+ Добавить эпизод</a>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="search-bar" style="margin-bottom:0;">
          <div style="display:flex;align-items:center;gap:8px;">
            <label style="font-size:13px;font-weight:600;color:var(--gray-mid);white-space:nowrap;">Шоу:</label>
            <select class="form-select" id="show-select" style="width:240px;">
              <option value="">Все шоу</option>
            </select>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th class="hide-mobile"></th><th class="hide-mobile">№</th><th>Название</th><th class="hide-mobile">Шоу</th><th class="hide-mobile">Участники</th><th>Действия</th></tr></thead>
          <tbody id="episodes-tbody"><tr><td colspan="6"><div class="loading">Загрузка...</div></td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="auth.js"></script>
<script src="shared.js"></script>
<script>
  let allEpisodes = [], showMap = {};
  const preSelectedShowId = new URLSearchParams(window.location.search).get('show_id');

  async function load() {
    try {
      const [episodesData, showsData] = await Promise.all([API.getEpisodes(), API.getShows()]);
      allEpisodes = episodesData.episodes || [];
      const shows = showsData.shows || [];
      shows.forEach(s => { showMap[s.show_id] = s; });

      const sel = document.getElementById('show-select');
      shows.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.show_id;
        opt.textContent = s.name;
        sel.appendChild(opt);
      });

      if (preSelectedShowId) {
        sel.value = preSelectedShowId;
        document.getElementById('add-btn').href = `episodes-edit.html?show_id=${preSelectedShowId}`;
      }

      filter();
    } catch (err) { handleError(err, 'Ошибка загрузки'); }
  }

  function filter() {
    const showId = document.getElementById('show-select').value;
    const filtered = showId ? allEpisodes.filter(e => e.show_id === showId) : allEpisodes;
    const sorted = filtered.slice().sort((a, b) => {
      const sa = showMap[a.show_id]?.name || '', sb = showMap[b.show_id]?.name || '';
      return sa !== sb ? sa.localeCompare(sb) : a.number - b.number;
    });
    render(sorted);
    document.getElementById('add-btn').href = showId
      ? `episodes-edit.html?show_id=${showId}`
      : 'episodes-edit.html';
  }

  function render(episodes) {
    const tbody = document.getElementById('episodes-tbody');
    if (!episodes.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><span class="empty-text">Нет эпизодов</span></div></td></tr>';
      return;
    }
    tbody.innerHTML = episodes.map(ep => {
      const thumb = ep.thumbnail_url
        ? `<img src="${escapeHtml(ep.thumbnail_url)}" alt="" style="width:60px;height:40px;object-fit:cover;border-radius:4px;">`
        : `<div style="width:60px;height:40px;background:var(--purple-light);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--purple);">▶</div>`;
      const show = showMap[ep.show_id];
      const showTag = show ? `<span class="badge" style="background:var(--purple-light);color:var(--purple);font-size:10px;">${escapeHtml(show.name)}</span>` : '';
      const perfCount = (ep.performer_ids || []).length;
      return `<tr>
        <td class="hide-mobile">${thumb}</td>
        <td class="hide-mobile" style="font-family:var(--mono);font-size:13px;color:var(--gray-mid);">${ep.number}</td>
        <td>
          <div style="font-weight:600;">${escapeHtml(ep.title)}</div>
          <div style="font-size:12px;color:var(--gray-mid);">${escapeHtml(ep.slug || '')}</div>
        </td>
        <td class="hide-mobile">${showTag}</td>
        <td class="hide-mobile" style="font-size:13px;color:var(--gray-mid);">${perfCount ? `${perfCount} уч.` : '—'}</td>
        <td><div class="table-actions">
          <button class="btn btn-ghost btn-sm" onclick="navigateTo('episodes-edit.html?id=${ep.episode_id}')">Редактировать</button>
          <button class="btn btn-danger btn-sm" onclick="del('${ep.episode_id}','${escapeHtml(ep.title)}')">Удалить</button>
        </div></td>
      </tr>`;
    }).join('');
  }

  async function del(id, title) {
    if (!confirm(`Удалить эпизод "${title}"?`)) return;
    try {
      await API.deleteEpisode(id);
      showToast('Эпизод удалён');
      allEpisodes = allEpisodes.filter(e => e.episode_id !== id);
      filter();
    } catch (err) { handleError(err, 'Ошибка удаления'); }
  }

  document.getElementById('show-select').addEventListener('change', filter);
  load();
</script>
</body>
</html>
