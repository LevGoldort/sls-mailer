<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>История Instagram — Yalla Balagan Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hist-grid { display: flex; flex-direction: column; gap: 10px; }
    .hist-card {
      display: flex; align-items: center; gap: 16px;
      border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px;
      background: #fff;
    }
    .hist-thumb {
      width: 48px; height: 48px; border-radius: 6px; object-fit: cover;
      background: var(--gray-light); flex-shrink: 0;
    }
    .hist-thumb-placeholder {
      width: 48px; height: 48px; border-radius: 6px; background: var(--gray-light);
      display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .hist-info { flex: 1; min-width: 0; }
    .hist-handle { font-weight: 600; font-size: 13px; color: var(--dark); }
    .hist-meta { font-size: 12px; color: var(--gray-mid); margin-top: 2px; }
    .hist-empty { text-align: center; padding: 48px 0; color: var(--gray-mid); font-size: 14px; }
    .month-picker { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .month-picker input { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  </style>
</head>
<body>
<button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar-container"></nav>
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">История публикаций</h1>
        <p class="page-subtitle">Instagram Stories через Stories Studio</p>
      </div>
      <div class="page-actions">
        <a href="instagram-settings.html" class="btn btn-secondary">Настройки Instagram</a>
        <a href="stories-studio.html" class="btn btn-primary">Stories Studio</a>
      </div>
    </div>

    <div class="month-picker">
      <label style="font-size:13px;color:var(--gray-mid)">Месяц:</label>
      <input type="month" id="month-input">
      <button class="btn btn-secondary" onclick="loadHistory()">Показать</button>
    </div>

    <div id="history-container"><div class="loading">Загрузка...</div></div>
  </main>
</div>
<script src="auth.js"></script>
<script src="shared.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await initAdmin();
    const now = new Date();
    document.getElementById('month-input').value =
      `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    loadHistory();
  });

  async function loadHistory() {
    const month = document.getElementById('month-input').value;
    const container = document.getElementById('history-container');
    container.innerHTML = '<div class="loading">Загрузка...</div>';
    try {
      const data = await apiCall(`/api/instagram/history?month=${month}`);
      render(data.history || []);
    } catch (e) {
      container.innerHTML = `<div class="error-msg">Ошибка: ${e.message}</div>`;
    }
  }

  function render(items) {
    const container = document.getElementById('history-container');
    if (!items.length) {
      container.innerHTML = '<div class="hist-empty">Публикаций в этом месяце нет.</div>';
      return;
    }
    container.innerHTML = `<div class="hist-grid">${items.map(item => {
      const date = item.posted_at
        ? new Date(item.posted_at).toLocaleString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })
        : '—';
      const thumb = item.thumbnail_url
        ? `<img class="hist-thumb" src="${item.thumbnail_url}" alt="">`
        : `<div class="hist-thumb-placeholder">📸</div>`;
      return `
        <div class="hist-card">
          ${thumb}
          <div class="hist-info">
            <div class="hist-handle">@${item.ig_username || item.ig_user_id}</div>
            <div class="hist-meta">${date}</div>
          </div>
          <a href="https://www.instagram.com/${item.ig_username}/" target="_blank" rel="noopener"
             class="btn btn-secondary btn-sm">Открыть</a>
        </div>
      `;
    }).join('')}</div>`;
  }
</script>
</body>
</html>
