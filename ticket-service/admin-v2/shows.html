<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шоу — Yalla Balagan Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shows-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .show-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; transition: box-shadow .15s; }
    .show-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .show-photo { width: 100%; height: 160px; object-fit: cover; background: var(--gray-light); }
    .show-photo-placeholder { width: 100%; height: 160px; background: var(--gray-light); display: flex; align-items: center; justify-content: center; font-size: 48px; color: var(--gray-mid); }
    .show-body { padding: 14px; }
    .show-name { font-size: 15px; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
    .show-slug { font-size: 12px; color: var(--gray-mid); margin-bottom: 6px; }
    .show-desc { font-size: 12px; color: var(--gray-mid); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .show-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
    .show-actions .btn { flex: 1; }
    .badge-ep { background: var(--purple-light); color: var(--purple); font-size: 11px; padding: 2px 7px; border-radius: 8px; font-weight: 600; }
  </style>
</head>
<body>
<button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar-container"></nav>
  <main class="main">
    <div class="page-header">
      <div><h1 class="page-title">Шоу и контент</h1></div>
      <div class="page-actions">
        <a href="shows-edit.html" class="btn btn-primary">+ Добавить шоу</a>
      </div>
    </div>

    <div id="shows-container">
      <div class="loading">Загрузка...</div>
    </div>
  </main>
</div>
<script src="auth.js"></script>
<script src="shared.js"></script>
<script>
  async function load() {
    try {
      const [showsData, episodesData] = await Promise.all([
        API.getShows(),
        API.getEpisodes(),
      ]);
      const shows = showsData.shows || [];
      const countMap = {};
      (episodesData.episodes || []).forEach(ep => {
        countMap[ep.show_id] = (countMap[ep.show_id] || 0) + 1;
      });
      render(shows, countMap);
    } catch (err) {
      handleError(err, 'Ошибка загрузки');
      document.getElementById('shows-container').innerHTML =
        '<div class="card"><div class="card-body"><div class="empty"><span class="empty-text">Ошибка загрузки</span></div></div></div>';
    }
  }

  function render(shows, countMap) {
    const container = document.getElementById('shows-container');
    if (!shows.length) {
      container.innerHTML = '<div class="card"><div class="card-body"><div class="empty"><span class="empty-text">Нет шоу</span></div></div></div>';
      return;
    }
    const cards = shows.map(s => {
      const photo = s.photo_url
        ? `<img class="show-photo" src="${escapeHtml(s.photo_url)}" alt="">`
        : `<div class="show-photo-placeholder">📺</div>`;
      const epCount = countMap[s.show_id] || 0;
      return `<div class="show-card">
        ${photo}
        <div class="show-body">
          <div class="show-name">${escapeHtml(s.name)} <span class="badge-ep">${epCount} эп.</span></div>
          ${s.slug ? `<div class="show-slug">/${escapeHtml(s.slug)}</div>` : ''}
          ${(s.short_description || s.description) ? `<div class="show-desc">${escapeHtml(s.short_description || s.description)}</div>` : ''}
        </div>
        <div class="show-actions">
          <button class="btn btn-ghost btn-sm" onclick="navigateTo('episodes.html?show_id=${s.show_id}')">Эпизоды</button>
          ${s._readonly
            ? `<button class="btn btn-ghost btn-sm" onclick="removeSharing('${s.show_id}')">Убрать</button>`
            : `<button class="btn btn-ghost btn-sm" onclick="navigateTo('shows-edit.html?id=${s.show_id}')">Редактировать</button>
               <button class="btn btn-danger btn-sm" onclick="deleteShow('${s.show_id}','${escapeHtml(s.name).replace(/'/g,"\\'")}')">Удалить</button>`
          }
        </div>
      </div>`;
    }).join('');
    container.innerHTML = `<div class="shows-grid">${cards}</div>`;
  }

  async function removeSharing(id) {
    if (!confirm('Убрать это шоу из вашего доступа?')) return;
    try {
      await apiCall(`/api/shows/${id}/sharing`, 'DELETE');
      showToast('Убрано');
      load();
    } catch (err) { handleError(err, 'Ошибка'); }
  }

  async function deleteShow(id, name) {
    if (!confirm(`Удалить шоу "${name}"?`)) return;
    try {
      await API.deleteShow(id);
      showToast('Шоу удалено');
      load();
    } catch (err) { handleError(err, 'Ошибка удаления'); }
  }

  load();
</script>
</body>
</html>
